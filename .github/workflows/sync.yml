name: 每日同步台股資料

on:
  schedule:
    # cron 是 UTC。10:00 UTC = 台北 18:00。
    # 台股 13:30 收盤，交易所的日報表大約 15:00–16:00 才齊，留足緩衝。
    # GitHub 的排程本來就會誤點十幾分鐘到半小時，這裡不需要精準。
    - cron: '0 10 * * 1-5'
  # 讓你可以在 Actions 分頁手動按一下就跑
  workflow_dispatch:

# 同步是 upsert，重跑不會壞，但沒必要讓兩次同時寫
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # postinstall 會跑 prisma generate。
      # prisma.config.ts 讀的 DIRECT_URL 在這裡是空的，但 generate 不需要連資料庫，實測可以。
      - name: 安裝相依套件
        run: npm ci

      - name: 同步
        env:
          # 執行期只用得到 pooled 連線。DIRECT_URL 是 migrate 才要的，這裡不放。
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        shell: bash
        run: |
          # 預設的 bash -e 不含 pipefail，接了 tee 之後同步失敗會被 tee 的 0 蓋掉，整個 job 變綠燈
          set -o pipefail
          npm run sync -- --commit | tee sync.log

      - name: 把結果貼到執行摘要
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            tail -n 40 sync.log 2>/dev/null || echo '(沒有產生 log，通常是安裝階段就失敗了)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
