name: 每日同步台股資料

on:
  schedule:
    # ── 為什麼排這麼多輪 ────────────────────────────────────────
    #
    # STOCK_DAY_ALL 不吃日期參數，只給「最新一個交易日」。
    # 所以每個交易日 D 的行情只有一段固定的時間窗可以抓：
    #
    #   開始  D+1 清晨 03:00～05:20（台北）證交所 openapi 夜間批次跑完才出 D
    #   結束  D+2 清晨（台北）批次再跑一次，快照翻成 D+1，D 就再也抓不到
    #
    # 注意開始時間不是當天傍晚。網頁報表台北 15:00-16:00 就出齊了，
    # 但這裡吃的 openapi 是夜間批次，慢十幾個小時。三個來源的節奏還不一樣：
    #
    #   櫃買    D 當天晚上就出 D
    #   證交所  D+1 清晨 03:00～05:20 才出 D
    #   興櫃    D 當天下午（比上市上櫃早一天）
    #
    # 所以每天有約 13 小時證交所還停在 D-1、櫃買已經給 D，舊日期守門會擋下
    # 不寫。那是正常狀態不是故障，守門因此是「跳過」而不是「失敗」。
    #
    # GitHub 的排程誤點遠比文件說的嚴重：實測 2026-10-01 ~ 10-13 這 9 次，
    # '0 10' 這條每次都延遲 6 ~ 9.5 小時
    # （16:07 / 16:32 / 16:50 / 16:54 / 17:13 / 17:18 / 17:23 / 19:05 / 19:39Z）。
    # 整點是大家都在排的時間、排隊最久，所以改用奇數分鐘。
    #
    # 下面四輪實測延遲 2～5 小時後，分別落在台北約：
    #
    #   10:17 UTC → 23:05   證交所還沒出表，跳過
    #   14:17 UTC → 02:20   證交所還沒出表，跳過
    #   18:17 UTC → 05:20   出表了，寫入
    #   22:17 UTC → 08:28   已是最新
    #
    # 前兩輪抓不到是預期內的，留著是因為證交所偶爾早出，而且不花什麼成本。
    #
    # 第一輪刻意不排更早：太早跑會抓到前一天的快照，
    # 而且上市上櫃會「一致地」給前一天，守門擋不住（它只比對兩邊是否同一天），
    # 結果是把昨天原值覆寫一次、job 全綠、今天的行情就這樣沒了。
    - cron: '17 10 * * 1-5'
    - cron: '17 14 * * 1-5'
    - cron: '17 18 * * 1-5'
    - cron: '17 22 * * 1-5'
    # 週六補一輪專門救星期五：週末沒有交易，快照會一直停在星期五，
    # 整個週末都補得回來。沒有這輪的話，星期五那四輪全掛就要等到星期一，
    # 而星期一下午快照就翻成星期一了。
    - cron: '17 3 * * 6'
  # 讓你可以在 Actions 分頁手動按一下就跑
  workflow_dispatch:

# 失敗時要開 issue，所以需要寫入權限；其餘維持唯讀
permissions:
  contents: read
  issues: write

# 同步是 upsert，重跑不會壞，但沒必要讓兩次同時寫
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # postinstall 會跑 prisma generate。
      # prisma.config.ts 讀的 DIRECT_URL 在這裡是空的，但 generate 不需要連資料庫，實測可以。
      - name: 安裝相依套件
        run: npm ci

      # 同步失敗時第一個要問的是「是不是連不到來源」。
      # GitHub 的 runner 在美國，證交所／櫃買有可能擋境外或雲端 IP，
      # 先個別打一次把狀態印出來，免得只看到一句 exit code 1。
      - name: 來源連通性檢查
        shell: bash
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$2" || echo "連線失敗")
            printf '  %-28s %s\n' "$1" "$code"
          }
          echo "runner 對外 IP: $(curl -s --max-time 15 https://api.ipify.org || echo '(查不到)')"
          check 'TWSE 上市日成交'   'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL'
          check 'TWSE 上市本益比'   'https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL'
          check 'TWSE 上市基本資料' 'https://openapi.twse.com.tw/v1/opendata/t187ap03_L'
          check 'TWSE 休市行事曆'   'https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule'
          check 'TPEx 上櫃日收盤'   'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes'
          check 'TPEx 上櫃本益比'   'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis'
          check 'TPEx 興櫃行情'     'https://www.tpex.org.tw/openapi/v1/tpex_esb_latest_statistics'
          check 'FinMind'          'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo'

      - name: 檢查必要的 secret 有沒有設
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          # 只印長度，不印值
          [ -n "$DATABASE_URL" ]  && echo "  DATABASE_URL  已設定（${#DATABASE_URL} 字元）"  || { echo "  DATABASE_URL 未設定"; exit 1; }
          [ -n "$FINMIND_TOKEN" ] && echo "  FINMIND_TOKEN 已設定（${#FINMIND_TOKEN} 字元）" || echo "  FINMIND_TOKEN 未設定（會走匿名額度，容易被限流）"

      - name: 同步
        env:
          # 執行期只用得到 pooled 連線。DIRECT_URL 是 migrate 才要的，這裡不放。
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        shell: bash
        run: |
          # 預設的 bash -e 不含 pipefail，接了 tee 之後同步失敗會被 tee 的 0 蓋掉，整個 job 變綠燈
          set -o pipefail
          # 2>&1 很重要：腳本的錯誤走 console.error（stderr），
          # 只導 stdout 的話失敗時 log 會停在最後一行正常輸出，完全看不到原因
          npm run sync -- --commit 2>&1 | tee sync.log

      # 「同步失敗」會變紅燈，看得見；但「同步成功卻什麼有用的都沒寫」不會。
      # 這支補的就是那個洞：直接拿證交所行事曆說該開市的日子，
      # 去比對資料庫到底有沒有那一天。
      # 用 always() 是因為同步失敗時更需要知道「到底掉了哪幾天」。
      - name: 缺日偵測
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -o pipefail
          npm run check-gaps 2>&1 | tee gaps.log

      - name: 把結果貼到執行摘要
        if: always()
        shell: bash
        run: |
          {
            echo '### 同步'
            echo '```'
            tail -n 60 sync.log 2>/dev/null || echo '(沒有產生 log，通常是安裝階段就失敗了)'
            echo '```'
            echo '### 缺日偵測'
            echo '```'
            tail -n 60 gaps.log 2>/dev/null || echo '(沒有產生 log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 執行摘要只有在瀏覽器裡看得到，job log 則要 repo admin 權限才下載得了。
      # 存成 artifact 之後，不必翻 Actions 頁面也拿得到失敗當下的完整輸出。
      - name: 失敗時留下 log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_number }}
          path: |
            sync.log
            gaps.log
          retention-days: 30
          if-no-files-found: ignore

      # Issue 的內容是公開可讀的（API 也讀得到），失敗原因不會再卡在
      # 「只有 repo admin 下載得到 log」。同一天重複失敗接在同一張底下留言，不洗版。
      - name: 失敗時開 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          TITLE="同步失敗 $(TZ=Asia/Taipei date +%F)"
          {
            echo "觸發：\`${{ github.event_name }}\`　執行：$RUN_URL"
            echo ""
            echo "#### 同步"
            echo '```'
            tail -n 40 sync.log 2>/dev/null || echo '(沒有產生 sync.log)'
            echo '```'
            echo "#### 缺日偵測"
            echo '```'
            tail -n 40 gaps.log 2>/dev/null || echo '(沒有產生 gaps.log)'
            echo '```'
          } > issue.md

          NUM=$(gh issue list --state open --limit 20 --json number,title \
                  --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file issue.md
            echo "已在 issue #$NUM 留言"
          else
            gh issue create --title "$TITLE" --body-file issue.md
          fi
