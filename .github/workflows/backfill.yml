name: 歷史資料回補

# FinMind 免費層必須逐檔抓，三千多檔一次跑不完，所以切成每小時一批。
# 進度記在 backfill_log，每批只處理還沒補過的，跑完就自己閒置。
on:
  schedule:
    # 每 6 小時一次，分鐘刻意選 :07。
    #
    # 原本設每小時 :30，實測連續三小時一次都沒觸發——設定完全正確
    # （workflow state=active、預設分支、schedule 在 main 上），
    # 純粹是 GitHub 的排程沒跑。官方文件明說排程是盡力而為，
    # 整點與半點最壅塞，高負載時會延遲甚至整個丟棄。
    #
    # 改成單次跑滿 5.5 小時（job 上限 6 小時），每 6 小時觸發一次剛好銜接。
    # 觸發次數少一個數量級，錯過一次的代價也小得多。
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '這次處理幾檔（留空＝用滿 5.5 小時）'
        required: false

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 上傳 Release asset 需要寫入權限
    permissions:
      contents: write
    # 排程每 6 小時一次，這裡設 5 小時，留 1 小時餘裕。
    # 逾時會被標成 cancelled，那是正常的——進度記在 backfill_log，
    # 下一輪接著跑。留餘裕是為了確保前一輪一定先結束，
    # 兩輪重疊的話 FinMind 的呼叫速率會加倍而撞到額度上限。
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 回補
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          # 「日頻 Parquet 外存」資料集把年度檔寫到這裡，下一步再上傳
          PARQUET_DIR: ${{ github.workspace }}/parquet
          # 既有年度檔的網址。跨輪執行時用它把上一輪的結果合併進來，
          # 沒設的話每輪都只會輸出該輪抓到的股票，等於把前一輪蓋掉。
          PARQUET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/daily-parquet-year
        shell: bash
        run: |
          set -o pipefail
          # 2>&1 不能少：錯誤走 stderr，只導 stdout 的話失敗時看不到原因
          # 不帶 --limit 時腳本會依 5.5 小時的額度自己算要處理幾檔
          npm run backfill -- --commit ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }} 2>&1 | tee backfill.log

      # 一年一個檔（2015.parquet …），12 個檔遠低於 Release 的 1,000 個 asset 上限。
      #
      # 舊的 daily-parquet 是「一檔股票一個檔」，補到第 1,000 個就撞上限、
      # 之後每輪上傳都失敗。那個 release 保留不動（還查得到那 1,000 檔），
      # 等這邊重建完驗證過再手動刪掉：
      #   gh release delete daily-parquet -y
      - name: 上傳年度 Parquet 到 Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(parquet/*.parquet)
          if [ ${#files[@]} -eq 0 ]; then
            echo "這一輪沒有產生 Parquet（還輪不到那個資料集）"
            exit 0
          fi
          echo "準備上傳 ${#files[@]} 個年度檔"
          ls -lh parquet/*.parquet
          gh release view daily-parquet-year >/dev/null 2>&1 ||             gh release create daily-parquet-year               --title '台股日頻明細（Parquet，一年一檔）'               --notes 'DuckDB 可直接以網址查詢，不必下載整包。欄位：date, stock_id, open, high, low, close, volume, turnover'
          gh release upload daily-parquet-year "${files[@]}" --clobber
          du -sh parquet

      - name: 把結果貼到執行摘要
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            # 開頭的進度與結尾的統計最有用，中間幾百行逐檔明細略過
            head -n 12 backfill.log 2>/dev/null
            echo '...'
            tail -n 12 backfill.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || echo '(沒有產生 log)' >> "$GITHUB_STEP_SUMMARY"
